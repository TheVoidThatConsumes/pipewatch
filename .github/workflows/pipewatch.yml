name: pipewatch audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pipewatch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pipewatch
        run: pip install pipewatch-cli

      - name: Set baseline
        run: pipewatch baseline --commit 7e3121e 
        env:
          PIPEWATCH_HMAC_KEY: ${{ secrets.PIPEXSCAN }}

      - name: Run audit
        run: pipewatch audit --verify-shas --json | tee pw-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPEWATCH_HMAC_KEY: ${{ secrets.PIPEXSCAN }}

      - name: Fail on HIGH or CRITICAL
        run: jq -e '.summary.HIGH == 0 and .summary.CRITICAL == 0' pw-report.json