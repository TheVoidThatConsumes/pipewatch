[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipewatch-cli"
version = "0.6.0"
description = "Integrity monitoring and static analysis for CI/CD pipelines"
readme = {file = "README.md", content-type = "text/markdown"}
license = "CC-BY-4.0"
requires-python = ">=3.12"
keywords = ["security", "ci-cd", "pipeline", "integrity", "static-analysis", "devops"]
dependencies = ["pyyaml>=6.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/TheVoidThatConsumes/pipewatch"
Source = "https://github.com/TheVoidThatConsumes/pipewatch"
"Bug Tracker" = "https://github.com/TheVoidThatConsumes/pipewatch/issues"

[project.scripts]
pipewatch = "pipewatch:main"

[tool.setuptools]
py-modules = ["pipewatch"]